[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-hybrid-ai"
version = "0.1.0"
description = "Local inference and chronological training modules for the XAUUSD Hybrid AI MT5 EA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "black>=24,<27",
    "build>=1.2,<2",
]

[project.scripts]
xauusd-ai = "hybrid_ai.__main__:main"
xauusd-prepare-data = "training.prepare_data:main"
xauusd-train-model = "training.train_model:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
addopts = "-ra"

[tool.black]
line-length = 100
